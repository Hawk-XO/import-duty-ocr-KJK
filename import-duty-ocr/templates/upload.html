<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Invoice PDF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .drop-zone {
            border: 2px dashed #6c757d;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            color: #6c757d;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .drop-zone.dragover {
            background-color: #f8f9fa;
        }

        .drop-zone input {
            display: none;
        }

        .spinner-border {
            width: 2rem;
            height: 2rem;
        }

        #loading-msg {
            display: none;
        }

        #upload-section {
            display: none;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="text-end mb-4">
        <a href="/start" class="btn btn-outline-secondary" style="font-size: 1.8rem; padding: 12px 28px;">
            HOME
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3 class="mb-4 text-center">Select Invoice Type</h3>
            <form method="POST" enctype="multipart/form-data" id="upload-form">
                <div class="mb-4">
                    <label for="invoice_type" class="form-label">Choose Type</label>
                    <select class="form-select" name="company_selected" id="invoice_type" required>
                        <option value="" disabled selected>Select Invoice Type</option>
                        <option value="XLNT">XLNT</option>
                        <option value="EXTRAMET">EXTRAMET</option>
                        <option value="MGT">MGT</option>
                    </select>
                </div>

                <div id="upload-section">
                    <label for="pdf_file" class="form-label">Drag & Drop or Click to Upload</label>
                    <div class="drop-zone" id="drop-zone">
                        <span>Drop your PDF file here or click to browse</span>
                        <input type="file" name="pdf_file" id="pdf_file" accept=".pdf" required>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary w-100" id="submit-btn">Extract & Fill Form</button>
                        <div class="mt-3 text-center" id="loading-msg">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 mb-0">Processing... Please wait</p>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('pdf_file');
    const form = document.getElementById('upload-form');
    const submitBtn = document.getElementById('submit-btn');
    const loadingMsg = document.getElementById('loading-msg');
    const uploadSection = document.getElementById('upload-section');
    const invoiceTypeSelect = document.getElementById('invoice_type');

    // Show upload section only after invoice type is selected
    invoiceTypeSelect.addEventListener('change', () => {
        uploadSection.style.display = 'block';
    });

    // Drop zone behavior
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
        }
    });

    // Show spinner on submit
    form.addEventListener('submit', () => {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Uploading...';
        loadingMsg.style.display = 'block';
    });
</script>
</body>
</html>
